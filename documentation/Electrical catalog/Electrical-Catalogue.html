function preferred(d){return d==='NG1'||['Motion'].includes(devices[d]?.category)?'gantry':d==='NH1'||['Hydroponics'].includes(devices[d]?.category)?'hydro':['Arm'].includes(devices[d]?.category)?'arm':['Power','Lighting'].includes(devices[d]?.category)?'power':'overview'}
function showWire(id){selectedWire=id;selectedDevice=null;let c=wires[id];let current=DATA.views.find(v=>v.id===view);if(tab!=='wiring'||!current.edges.some(e=>e.connections.includes(id))){let wanted=({gantry:'gantry',hydro:'hydro',arm:'arm',power:'power',control:'overview'})[c.scope];view=DATA.views.find(v=>v.id===wanted&&v.edges.some(e=>e.connections.includes(id)))?.id||DATA.views.find(v=>v.edges.some(e=>e.connections.includes(id))).id;camera=null;tab='wiring';setTab(tab);return}drawMap();renderInspector()}
function renderWiring(){main.innerHTML=`<div class="row between" style="margin-bottom:13px"><div><p class="eyebrow">CONNECTED POWER AND CONTROL</p><h2>Interactive wiring explorer</h2></div><span class="minor">Documentation only · no hardware connection</span></div><p class="note">Actuator-power removal can drop the vertical gantry. E-stop leaves the Pi, Nanos, sensor logic and lighting powered. Use wall-power isolation for wiring work.</p><section class="toolbar"><div class="row between"><nav class="viewtabs" aria-label="Wiring views">${DATA.views.map(v=>`<button data-view="${v.id}" class="${v.id===view?'active':''}">${esc(v.id==='overview'?'Overview':v.id==='hydro'?'Hydro / Molex':v.id==='arm'?'Arm UART':v.id==='gantry'?'Gantry':'Power')}</button>`).join('')}</nav><div class="state"><span>Reported E-stop state</span><button id="estop" class="${pressed?'pressed':''}">${pressed?'Pressed · actuator supply off':'Released · actuator supply on'}</button></div></div><div class="legend">${[['power','Power'],['signal','Signals'],['return','Returns'],['bus','USB / ribbon / servo bus']].map(([id,title])=>`<label><input type="checkbox" data-filter="${id}" ${filters[id]?'checked':''}> ${title}</label>`).join('')}<label><input type="checkbox" id="labels" ${labels?'checked':''}> Wire labels</label><span><i class="dash"></i>Untraced terminal or colour detail</span></div></section><p class="powercaption" id="powercaption">${pressed?'Power-path illustration: 24 V actuator and 12 V loads are off. Logic/control wiring can remain powered.':'Power-path illustration follows the recorded branches; individual contact poles remain untraced.'}</p><p class="minor" id="viewsubtitle"></p><div class="mapgrid"><div class="mapwrap"><div class="map" id="map"></div><div class="mapcontrols"><button data-zoom-map="in" aria-label="Zoom in">+</button><button data-zoom-map="out" aria-label="Zoom out">−</button><button data-zoom-map="fit">Fit</button><button id="cleartrace">Clear trace</button></div><span class="maphint">Drag to pan · Ctrl + wheel to zoom · select a block or wire</span></div><aside class="inspector" id="inspector" aria-label="Selected electrical connection"></aside></div><details class="verification"><summary>Terminal details that still need tracing</summary><div class="verifylist">${DATA.verification.map(v=>`<p><strong>${v.id} · ${esc(v.title)}</strong><br>${esc(v.detail)}</p>`).join('')}</div></details>`;camera=null;drawMap();renderInspector();document.getElementById('estop').onclick=()=>{pressed=!pressed;let c=camera;renderWiring();camera=c;drawMap()};document.getElementById('labels').onchange=e=>{labels=e.target.checked;drawMap()};document.querySelectorAll('[data-filter]').forEach(x=>x.onchange=()=>{filters[x.dataset.filter]=x.checked;drawMap()});bindMap()}
function nodesForView(){return Object.fromEntries(DATA.views.find(v=>v.id===view).nodes.map(n=>[n.id,n]))}
function endpoint(name,other,nodes){let [id,port]=name.split(':');let n=nodes[id];if(!n)throw new Error('Missing drawing node '+id);let p=n.ports.find(x=>x.name===port);if(p)return [n.x+(p.side==='r'?n.w:0),n.y+p.y];let o=nodes[other.split(':')[0]];if(Math.abs(n.x-o.x)<120)return[n.x+n.w/2,n.y+(o.y>n.y?n.h:0)];return[n.x+(o.x>n.x?n.w:0),n.y+n.h/2]}
function points(e,nodes){let a=endpoint(e.a,e.b,nodes),b=endpoint(e.b,e.a,nodes);let raw;if(e.route)raw=[a,...e.route,b];else if(Math.abs(a[0]-b[0])<1||Math.abs(a[1]-b[1])<1)raw=[a,b];else{let mid=(a[0]+b[0])/2;raw=[a,[mid,a[1]],[mid,b[1]],b]}let result=[raw[0]];for(let i=1;i<raw.length;i++){let prev=result.at(-1),next=raw[i];if(prev[0]!==next[0]&&prev[1]!==next[1])result.push([next[0],prev[1]]);result.push(next)}return result}
function longestLabel(p){let best=0,at=[0,0];for(let i=1;i<p.length;i++){let len=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(len>best){best=len;at=[(p[i][0]+p[i-1][0])/2,(p[i][1]+p[i-1][1])/2]}}return at}
function kindVisible(c){return c.kind==='power'||c.kind==='mains'?filters.power:c.kind==='return'?filters.return:['usb','ribbon','servo','motor'].includes(c.kind)?filters.bus:filters.signal}
function activeIds(){if(selectedWire){let net=wires[selectedWire].net;return new Set(DATA.connections.filter(c=>c.net===net).map(c=>c.id))}if(selectedDevice)return new Set(deviceConnections(selectedDevice).map(c=>c.id));return null}
function drawMap(){let v=DATA.views.find(v=>v.id===view),nodes=nodesForView(),active=activeIds();if(!camera)camera={x:-45,y:-45,w:v.width+90,h:v.height+90};let usedLabels=[];let body='';
 for(const e of v.edges){let cs=e.connections.map(id=>wires[id]).filter(kindVisible);if(!cs.length)continue;let on=!active||cs.some(c=>active.has(c.id));let p=points(e,nodes),path='M'+p.map(x=>x.join(',')).join(' L');let uncertain=cs.some(c=>c.status!=='recorded'),unpowered=pressed&&cs.every(c=>c.domain==='actuator')&&['power','motor','servo'].includes(e.kind);let paired=e.kind==='power'&&cs.some(c=>c.kind==='return')&&cs.some(c=>c.kind==='power');let fill=colour(e.colour);let classes='wiregroup'+(on?'':' dim')+(active&&on?' active':'');let line=(stroke,width,extra='')=>`<path class="wireline" d="${path}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-linejoin="round" ${uncertain?'stroke-dasharray="8 5"':''} ${extra}/>`;
 body+=`<g class="${classes}" data-map-edge="${e.id}" tabindex="0" role="button" aria-label="${esc(e.label)}" ${unpowered?'opacity=".28"':''}><title>${esc(e.label)} · ${cs.length} recorded conductors / links</title><path d="${path}" fill="none" stroke="#fff" stroke-width="12"/>`;
 if(paired)body+=line('#cf5750',7)+line('#303934',2);else{body+=line(e.colour==='white'?'#819086':'#fff',7)+line(fill,e.kind==='power'?4:3)}
 body+=`<path class="wirehit" d="${path}"/>${p.filter((_,i)=>i===0||i===p.length-1).map(pt=>cs.length>1?`<rect x="${pt[0]-4}" y="${pt[1]-4}" width="8" height="8" fill="#fff" stroke="${fill}" stroke-width="2"/>`:`<circle cx="${pt[0]}" cy="${pt[1]}" r="4" fill="${fill}"/>`).join('')}`;
 if(labels&&(view==='overview'||view==='power'||view==='arm'||view==='gantry'&&e.kind!=='signal'||active&&on)){
  let at=longestLabel(p),width=Math.min(360,e.label.length*7.4+18);let rect={x:at[0]-width/2,y:at[1]-26,w:width,h:24};for(let attempt=0;attempt<7;attempt++){if(!usedLabels.some(r=>rect.x<r.x+r.w&&rect.x+rect.w>r.x&&rect.y<r.y+r.h&&rect.y+rect.h>r.y))break;rect.y-=27}usedLabels.push(rect);body+=`<g class="label"><rect x="${rect.x}" y="${rect.y}" width="${rect.w}" height="24"/><text x="${at[0]}" y="${rect.y+17}" text-anchor="middle">${esc(e.label)}</text></g>`;
 }
 body+='</g>';
 }
 for(const n of v.nodes){let rel=!active||n.members.includes(selectedDevice)||v.edges.some(e=>(e.a.split(':')[0]===n.id||e.b.split(':')[0]===n.id)&&e.connections.some(c=>active.has(c)));let unpowered=pressed&&n.members.every(id=>devices[id]?.domain==='actuator');let cls='node'+(n.members.includes(selectedDevice)?' selected':'')+(!rel?' dim':'')+(unpowered?' unpowered':'');let title=n.title,max=Math.floor((n.w-34)/10.5),cut=title.lastIndexOf(' ',max);let lines=title.length>max&&cut>0?[title.slice(0,cut),title.slice(cut+1)]:[title];
 body+=`<g class="${cls}" data-map-device="${n.id}" role="button" tabindex="0" aria-label="${esc(n.title)}"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="7"/><text class="nodeid" x="${n.x+17}" y="${n.y+22}">${n.id}</text>${lines.map((l,i)=>`<text class="nodetitle" x="${n.x+17}" y="${n.y+47+i*23}">${esc(l)}</text>`).join('')}${lines.length===1||n.h>120?`<text class="nodesub" x="${n.x+17}" y="${n.y+n.h-14}">${esc(n.subtitle.length>43?n.subtitle.slice(0,40)+'…':n.subtitle)}</text>`:''}`;
 for(const pin of n.ports){let x=n.x+(pin.side==='r'?n.w:0),y=n.y+pin.y;body+=`<circle class="port" cx="${x}" cy="${y}" r="4.5"/><text class="pinlabel" x="${x+(pin.side==='r'?-15:15)}" y="${y+5}" text-anchor="${pin.side==='r'?'end':'start'}">${esc(pin.label||pin.name)}</text>`}body+='</g>';
 }
 document.getElementById('viewsubtitle').textContent=v.subtitle;
 document.getElementById('map').innerHTML=`<svg role="img" aria-label="${esc(v.title)}" viewBox="${camera.x} ${camera.y} ${camera.w} ${camera.h}"><title>${esc(v.title)}</title>${body}</svg>`;
}
function renderInspector(){let pane=document.getElementById('inspector');if(selectedWire){let c=wires[selectedWire];let siblings=DATA.connections.filter(w=>w.net===c.net);pane.innerHTML=`<p class="eyebrow">SELECTED CONNECTION</p><h2>${esc(c.net)}</h2><p>${marker(c.colour)} <span class="badge">${esc(c.kind)}</span></p><dl class="specs">${spec('Endpoint A',c.a+' · '+c.ap)+spec('Endpoint B',c.b+' · '+c.bp)+spec('Status',status(c.status))+(c.via?spec('Route',c.via):'')}</dl><p>${esc(c.note)}</p>${c.status!=='recorded'?'<p class="note">This route retains an unresolved colour or terminal detail. Use the Rev J drawing and trace the installation before rewiring.</p>':''}<div class="linkrow"><button class="button" data-device="${c.a}">${esc(c.a)} details</button><button class="button" data-device="${c.b}">${esc(c.b)} details</button></div><h3>Same named net</h3>${siblings.map(wireButton).join('')}`;return}
 if(selectedDevice){let d=devices[selectedDevice],list=deviceConnections(d.id);pane.innerHTML=`<span class="tag">${d.id} / ${esc(d.category)}</span><h2>${esc(d.name)}</h2>${d.image?`<img src="${d.image}" alt="${esc(d.name)}" data-zoom="${d.image}"><p class="caption">${esc(d.caption)}</p>`:''}<p>${esc(d.role)}</p><dl class="specs">${spec('Model',d.model)+spec('Power',d.power)+spec('Location',d.location)}</dl><div class="linkrow"><button class="button" data-full-device="${d.id}">Component details</button><a class="button" href="../GrowTech-Wall-Electrical-RevJ.pdf#page=${d.sheet}">Drawing E${String(d.sheet).padStart(2,'0')}</a></div>${d.notes.map(n=>`<p class="minor">${esc(n)}</p>`).join('')}<h3>Known connections</h3>${list.map(wireButton).join('')}`;return}
 pane.innerHTML=`<p class="eyebrow">TRACE A CONNECTION</p><h2>Select a device or wire</h2><p>Choose a block to highlight its links. Choose a wire to inspect its pin names, colour and any unresolved terminal details.</p><label for="deviceselect" class="minor">Jump to component</label><select id="deviceselect" style="width:100%;margin:6px 0 18px"><option value="">Choose a component…</option>${DATA.devices.map(d=>`<option value="${d.id}">${d.id} · ${esc(d.name)}</option>`).join('')}</select><p class="minor">Power pairs show supply and the matching return. Bus links expose their conductors in the connection list. Boxes on a multi-wire route represent a bundle, not a short between conductors. Line crossings do not create a junction.</p><h3>Drawing basis</h3><p class="minor">Electrical handover and Rev J E01–E08. Solid routes follow the supplied record; dashed routes retain unresolved terminal or colour details. These are recorded connections, not fresh continuity-test results.</p>`;document.getElementById('deviceselect').onchange=e=>{if(e.target.value){view=preferred(e.target.value);selectedDevice=e.target.value;selectedWire=null;renderWiring()}};
}
function bindMap(){let map=document.getElementById('map');map.onpointerdown=e=>{if(e.target.closest('[data-map-device],[data-map-edge]'))return;map.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,c:{...camera}}};map.onpointermove=e=>{if(!drag)return;let r=map.getBoundingClientRect();camera={...drag.c,x:drag.c.x-(e.clientX-drag.x)*drag.c.w/r.width,y:drag.c.y-(e.clientY-drag.y)*drag.c.h/r.height};drawMap()};map.onpointerup=()=>drag=null;map.onwheel=e=>{if(!e.ctrlKey)return;e.preventDefault();zoomMap(e.deltaY<0?.85:1.18)};map.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){let t=e.target.closest('[data-map-device],[data-map-edge]');if(t){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}}}
function zoomMap(f){let v=DATA.views.find(x=>x.id===view);let w=Math.max(v.width*.18,Math.min(v.width*2,camera.w*f));let ratio=w/camera.w;camera={x:camera.x+(camera.w-w)/2,y:camera.y+(camera.h-camera.h*ratio)/2,w,h:camera.h*ratio};drawMap()}
function renderSchedule(){main.innerHTML=`<div class="row between"><div><p class="eyebrow">PIN AND CONNECTOR LINKS</p><h2>Connection schedule</h2></div><input class="search" id="wiresearch" placeholder="Search D4, Molex, UART, colour…" aria-label="Search connections"></div><div class="filters">${[['all','All links'],['gantry','Gantry'],['hydro','Hydroponics / Molex'],['arm','Arm'],['power','Power'],['control','USB / Pi']].map(([v,t])=>`<button data-scope="${v}" class="${v==='all'?'active':''}">${t}</button>`).join('')}</div><p class="minor">Endpoint A/B identifies a physical connection, not current or data-flow direction. Molex positions are wire-entry drawing positions; position 5 is intentionally empty.</p><div id="wiretable" class="tablewrap">${table(DATA.connections)}</div>`;let scope='all';function update(){let q=document.getElementById('wiresearch').value.toLowerCase();let list=DATA.connections.filter(w=>(scope==='all'||w.scope===scope)&&JSON.stringify(w).toLowerCase().includes(q));document.getElementById('wiretable').innerHTML=table(list)}document.getElementById('wiresearch').oninput=update;document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;document.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('active',x===b));update()})}
function renderDrawings(){main.innerHTML=`<div class="row between"><div><p class="eyebrow">SUPPLIED DRAWING SET</p><h2>Rev J schematics</h2></div><a class="button" href="../GrowTech-Wall-Electrical-RevJ.pdf#page=${sheet}">Open original PDF</a></div><p class="minor">Original supplied sheets are retained unchanged. Select a sheet, then click its preview to enlarge it.</p><div class="drawgrid"><nav class="drawlist">${DATA.sheetTitles.map((t,i)=>`<button data-sheet="${i+1}" class="${sheet===i+1?'active':''}"><strong>E${String(i+1).padStart(2,'0')}</strong><br>${esc(t)}</button>`).join('')}</nav><img class="sheetimg" src="media/RevJ-E${String(sheet).padStart(2,'0')}.png" data-zoom="media/RevJ-E${String(sheet).padStart(2,'0')}.png" alt="Rev J sheet ${sheet}"></div>`}
function renderManuals(){main.innerHTML=`<p class="eyebrow">OPERATING DOCUMENTS AND TECHNICAL MANUALS</p><h2>Documents and pinout references</h2><p class="minor">Local handover files work offline. Manufacturer pages need internet access. Match the exact installed board or driver variant before applying a manual's settings.</p><div class="manualgrid">${DATA.manuals.map(([title,url])=>`<a href="${url}">${esc(title)} ↗</a>`).join('')}</div><h3>Manufacturer excerpts</h3><div class="manualgrid"><a href="../Manufacturer%20references/hts35-manufacturer-parameters.jpg">HTS-35H product parameters</a><a href="../Manufacturer%20references/wheeltec-official-product.jpg">Wheeltec P23C product reference</a><a href="../Manufacturer%20references/controller-interface-excerpt.png">Hiwonder controller interface</a></div>`}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab],[data-device],[data-full-device],[data-show-wiring],[data-wire],[data-category],[data-view],[data-map-device],[data-map-edge],[data-zoom-map],[data-sheet],[data-zoom],[data-back-components],#cleartrace');if(!t)return;
 if(t.dataset.tab){setTab(t.dataset.tab);return}if(t.dataset.device){showDevice(t.dataset.device);return}if(t.dataset.fullDevice){setTab('components');showDevice(t.dataset.fullDevice);return}if(t.dataset.showWiring){view=preferred(t.dataset.showWiring);selectedDevice=t.dataset.showWiring;selectedWire=null;setTab('wiring');return}if(t.dataset.wire){showWire(t.dataset.wire);return}if(t.dataset.category){category=t.dataset.category;renderComponents();return}if(t.hasAttribute('data-back-components')){setTab('components');return}if(t.dataset.view){view=t.dataset.view;selectedDevice=null;selectedWire=null;camera=null;renderWiring();return}if(t.dataset.mapDevice){let n=nodesForView()[t.dataset.mapDevice];if(n.members.length===1){selectedWire=null;showDevice(n.members[0])}else{let pane=document.getElementById('inspector');selectedDevice=null;selectedWire=null;drawMap();pane.innerHTML='<p class="eyebrow">COMPONENT GROUP</p><h2>'+esc(n.title)+'</h2>'+n.members.map(id=>'<button class="connbutton" data-device="'+id+'">'+id+' · '+esc(devices[id].name)+'</button>').join('')}return}if(t.dataset.mapEdge){let v=DATA.views.find(v=>v.id===view),edge=v.edges.find(x=>x.id===t.dataset.mapEdge);if(edge.connections.length===1){showWire(edge.connections[0])}else{selectedDevice=null;selectedWire=edge.connections[0];drawMap();document.getElementById('inspector').innerHTML='<p class="eyebrow">WIRE BUNDLE</p><h2>'+esc(edge.label)+'</h2><p class="minor">Select an individual conductor to trace its named net.</p>'+edge.connections.map(id=>wireButton(wires[id])).join('')}return}if(t.dataset.zoomMap){if(t.dataset.zoomMap==='fit'){camera=null;drawMap()}else zoomMap(t.dataset.zoomMap==='in'?.8:1.25);return}if(t.id==='cleartrace'){selectedDevice=null;selectedWire=null;drawMap();renderInspector();return}if(t.dataset.sheet){sheet=Number(t.dataset.sheet);renderDrawings();return}if(t.dataset.zoom){document.getElementById('zoomimg').src=t.dataset.zoom;document.getElementById('zoom').showModal()}});
document.getElementById('closezoom').onclick=()=>document.getElementById('zoom').close();
const initial=location.hash.slice(1);setTab(['wiring','components','schedule','drawings','manuals'].includes(initial)?initial:'wiring',false);
</script></body></html>
