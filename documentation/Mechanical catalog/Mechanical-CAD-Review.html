const image=x=>x.images[0]?'views/'+url(x.images[0].file):null;
function navButton(x){return `<button data-open="${x.id}" class="${x.id===selected?'selected':''}">${escape(x.title)}<small>${escape(x.code)}</small></button>`}
function branch(id,seen=new Set(),depth=0){if(seen.has(id))return '';let x=byId[id];let next=new Set([...seen,id]);let children=x.children.filter(i=>byId[i]);if(children.length)return `<li><details data-node="${id}" ${expanded.has(id)?'open':''}><summary>${navButton(x)}</summary><ul>${children.map(i=>branch(i,next,depth+1)).join('')}</ul></details></li>`;return '<li>'+navButton(x)+'</li>'}
function renderNav(){
 document.querySelectorAll('aside details').forEach(d=>{if(d.open)expanded.add(d.dataset.node);else expanded.delete(d.dataset.node)});if(selected)expanded.add(selected);
 document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
 document.getElementById('sidehint').textContent=query?'Results across the whole catalogue.':tab==='Assembly'?'Expand assemblies to browse their parts.':'Select a part to view its files and source.';
 if(query){tree.innerHTML=DATA.entries.filter(x=>visible(x)&&hits(x)).map(navButton).join('')||'<p class="minor">No matching parts.</p>';return}
 if(tab==='Assembly'){
  const root=byId[DATA.root];const reached=new Set();function walk(id){if(reached.has(id))return;reached.add(id);byId[id].children.forEach(walk)}walk(root.id);
  const other=DATA.entries.filter(x=>x.isAssembly&&!reached.has(x.id));tree.innerHTML='<ul>'+branch(root.id)+'</ul>'+(other.length?'<p class="group">Other included assemblies</p>'+other.map(navButton).join(''):'');
 }else if(tab==='Fabrication'){
  const groups=['Gantry GA','Robotic Arm RA','Hydroponics HA','Electronics Box EB'];tree.innerHTML=groups.map(g=>'<p class="group">'+escape(g)+'</p>'+DATA.entries.filter(x=>x.group===g&&visible(x)).map(navButton).join('')).join('');
 }else if(tab==='Standard'){
  tree.innerHTML=DATA.entries.filter(x=>x.category==='Standard').map(navButton).join('');
 }else tree.innerHTML='<p class="minor">'+(tab==='Purchasing'?'Suppliers and specifications transcribed from the mechanical handover.':'The current native models are arranged under Assembly, FAB and Standard. EB contains the separate electrical box mounts.')+'</p>';
}
const meta=x=>x.category==='Standard'?(x.isAssembly?'Standard assembly':'Standard part'):x.code;
function card(x){let src=image(x);return `<button class="card" data-open="${x.id}">${src?`<img loading="lazy" src="${src}" alt="${escape(x.title)}">`:`<div class="placeholder"><strong>${escape(x.code)}</strong><span>Preview not available</span></div>`}<div class="copy"><span class="code">${escape(meta(x))}</span><h3>${escape(x.title)}</h3><p>${escape(x.method)}${x.supplier?' · '+escape(x.supplier):''}</p></div></button>`}
function showGrid(){
 let items=DATA.entries.filter(x=>(query||x.category===tab)&&visible(x)&&(!query||hits(x)));
 if(tab==='Assembly'&&!query)items=DATA.entries.filter(x=>x.category==='Assembly'&&visible(x));
 let info=query?'Matching parts from the complete library.':tab==='Fabrication'?'Custom components grouped by gantry, robotic arm, hydroponics and electrical box.':tab==='Standard'?'Purchased components with the supplier recorded in the mechanical handover.':'Select an assembly, or expand the tree to browse its components.';
 main.innerHTML=`<div class="intro"><div><p class="eyebrow">${query?'SEARCH RESULTS':escape(tab.toUpperCase())}</p><h2>${query?escape(document.getElementById('search').value):tab==='Assembly'?'System and module assemblies':tab==='Fabrication'?'Fabricated parts':'Standard parts'}</h2><p>${info}</p></div><span class="count">${items.length} items</span></div>`;
 if(tab==='Fabrication'&&!query){for(const g of ['Gantry GA','Robotic Arm RA','Hydroponics HA','Electronics Box EB']){main.innerHTML+='<h3>'+escape(g)+'</h3>'+(g==='Electronics Box EB'?'<p class="minor">Electrical enclosure mounting parts supplied separately from the full assembly.</p>':'')+'<div class="grid">'+items.filter(x=>x.group===g).map(card).join('')+'</div>';}}
 else main.innerHTML+='<div class="grid">'+items.map(card).join('')+'</div>';
 if(!items.length)main.innerHTML+='<p class="empty">No matching parts.</p>';
}
function select(id,writeHash=true){
 const x=byId[id];if(!x)return;selected=id;expanded.add(id);renderNav();if(writeHash)history.pushState(null,'','#part-'+id);
 const src=image(x),sourceText=x.method==='Buy'?'Recorded supplier':'Make or source';
 const facts=[['Source',x.method],...[x.supplier?['Recorded supplier',x.supplier]:null,x.material?['Material',x.material]:null].filter(Boolean),['CAD file',`<a href="${cadUrl(x)}">${escape(x.filename)}</a>`],x.specification?['Specification',escape(x.specification)]:null].filter(Boolean);
 main.innerHTML=`<button class="back" data-back>‹ Back to ${escape(tab==='Purchasing'?'standard parts':tab.toLowerCase())}</button><div class="detailhead"><div><span class="code">${escape(meta(x))}</span>${!x.latest?'<span class="pill">Earlier included revision</span>':''}<h2>${escape(x.title)}</h2><p>${escape(x.description)}</p></div><a class="button" href="${cadUrl(x)}">Access CAD file ↗</a></div><div class="detail"><div><div class="imagebox">${src?`<img id="hero" src="${src}" alt="${escape(x.title)}">`:'<div class="placeholder"><strong>'+escape(x.code)+'</strong>Exact revision preview not available</div>'}</div>${x.images.length?'<div class="thumbs">'+x.images.map((v,i)=>`<button data-view="${i}" data-id="${id}" class="${i===0?'active':''}" aria-label="${escape(v.view+' '+v.configuration)}"><img src="views/${url(v.file)}" alt="${escape(v.view)}"></button>`).join('')+'</div><p class="viewcaption" id="viewcaption">'+escape(x.images[0].view+' · '+x.images[0].configuration)+'</p>':''}</div><div><section class="facts"><dl>${facts.map(([k,v])=>`<dt>${escape(k)}</dt><dd>${k==='Source'||k==='Recorded supplier'||k==='Material'?escape(v):v}</dd>`).join('')}</dl></section>${x.note?'<p class="note">'+escape(x.note)+'</p>':''}${x.stl.length?'<h3>Print exports</h3>'+x.stl.map(p=>'<p><a href="../../CAD%20library/README.html?file='+encodeURIComponent(p)+'">'+escape(p.split('/').pop())+'</a></p>').join(''):''}${x.variants.length?'<h3>'+escape(x.variantHeading||'Other included revisions')+'</h3>'+x.variants.map(i=>'<p><a href="#part-'+i+'" data-open="'+i+'">'+escape(byId[i].code)+(x.variantPurpose?' · '+escape(x.variantPurpose):(byId[i].latest?' · latest available':''))+'</a></p>').join(''):''}</div></div>`;
 if(x.children.length)main.innerHTML+='<h3>Components</h3><div class="parts">'+x.children.map(i=>{let c=byId[i],im=image(c);return `<button class="partrow" data-open="${i}">${im?`<img src="${im}" loading="lazy" alt="">`:''}<span>${escape(c.title)}<small>${escape(c.code)}${c.isAssembly?' · assembly':''}</small></span></button>`}).join('')+'</div>';

}
function purchasing(){main.innerHTML='<div class="intro"><div><p class="eyebrow">STANDARD COMPONENTS</p><h2>Purchasing references</h2><p>Recorded prototype suppliers and model specifications from the mechanical handover, Table 3.1. Supplier names are historical purchasing records; no new price or availability check is implied.</p></div></div><div class="tablewrap"><table><thead><tr><th>Component</th><th>Specification / model</th><th>Recorded supplier</th></tr></thead><tbody>'+DATA.purchases.map(p=>'<tr><td>'+escape(p.name)+'</td><td>'+escape(p.specification)+'</td><td>'+escape(p.supplier)+'</td></tr>').join('')+'</tbody></table></div>'}
function library(){main.innerHTML=`<div class="library"><p class="eyebrow">CAD FILES AND NAMING</p><h2>One library, three groups</h2><p>Open the native CAD files directly from each catalogue entry. Keep the Assembly, FAB and Standard folders together. The original <a href="../../CAD%20library/README.html?file=GTW003C.zip">GTW003C Pack and Go ZIP</a> is retained alongside the extracted files.</p><div class="split"><div><h3>File groups</h3><p><strong>Assembly</strong><br>System and module assemblies. Start at <a href="#part-${DATA.root}" data-open="${DATA.root}">GTW003C</a> and expand the assembly tree.</p><p><strong>Fabrication</strong><br>Custom parts in FAB, including the separately supplied electrical box mounts.</p><p><strong>Standard</strong><br>Purchased component models, sets and their internal model parts.</p></div><div><h3>Code key</h3><div class="tablewrap"><table style="min-width:0"><tbody>${DATA.naming.map(([a,b])=>'<tr><td>'+escape(a)+'</td><td>'+escape(b)+'</td></tr>').join('')}</tbody></table></div></div></div><h3>Making and buying parts</h3><p>Use the manufacturing process and material shown with each fabricated part. Available STL and 3MF exports are linked beside the native CAD file. For purchased components, match the model and specification before ordering from the listed supplier. Both mirrored Y-carriage plates are required. The arm gantry mount and tabletop test base serve different purposes.</p><h3>Related documents</h3><p><a href="../GrowTech-Wall-Mechanical-Handover.docx">Mechanical handover</a> · <a href="../GrowTech-Wall-BOM-Rechecked.xlsx">Existing BOM</a> · <a href="../reference/Project%20reports/KIG3011_Sem%202_Report_G21.docx">Original report</a></p><p class="minor">Use the previews to identify components, then open the linked native CAD file for dimensions and export options. Keep the Assembly, FAB and Standard folders together when transferring the library.</p></div>`}
function changeTab(t){tab=t;selected=null;query='';document.getElementById('search').value='';history.replaceState(null,'','#'+t.toLowerCase());renderNav();if(t==='Purchasing')purchasing();else if(t==='Library')library();else showGrid();}
document.addEventListener('click',e=>{let target=e.target.closest('[data-open],[data-tab],[data-back],[data-view]');if(!target)return;e.preventDefault();if(target.dataset.open){select(target.dataset.open);main.scrollIntoView({block:'start',behavior:'instant'})}else if(target.dataset.tab)changeTab(target.dataset.tab);else if(target.hasAttribute('data-back'))changeTab(tab);else if(target.dataset.view!==undefined){let x=byId[target.dataset.id],v=x.images[Number(target.dataset.view)];document.getElementById('hero').src='views/'+url(v.file);document.getElementById('viewcaption').textContent=v.view+' · '+v.configuration;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b===target));}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();selected=null;renderNav();showGrid()});
main.addEventListener('click',e=>{if(e.target.id==='hero'){document.getElementById('zoomimg').src=e.target.src;document.getElementById('zoom').showModal()}});document.getElementById('closezoom').onclick=()=>document.getElementById('zoom').close();
window.addEventListener('popstate',()=>init());
function init(){let hash=location.hash.slice(1);if(hash.startsWith('part-')&&byId[hash.slice(5)])select(hash.slice(5),false);else if(hash==='library')changeTab('Library');else if(['fabrication','standard','purchasing'].includes(hash))changeTab(hash[0].toUpperCase()+hash.slice(1));else{renderNav();select(DATA.root,false)}}init();
</script></body></html>
