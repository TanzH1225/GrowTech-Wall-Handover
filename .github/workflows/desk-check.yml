name: Desk checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Tk runtime for fake-widget tests
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Check assets, local links and headless tests
        run: python -B scripts/check.py
